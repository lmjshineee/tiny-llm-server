name: Bug report
description: Report a reproducible bug in the simulator, CLI, benchmark, or visualizer.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please keep the project's simulation boundary in mind: default
        latency/throughput values are synthetic, not hardware measurements.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the command, seed, and relevant configuration.
      placeholder: "pnpm demo --requests 80 --rate 1.5 --seed 42 ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Commands, input file, or a small code snippet.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "0.5.0 or commit SHA"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "macOS 27.3, Node 24.22.2, pnpm 12.18.0"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: I did not include secrets or private data.
          required: true
