name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Quality gates (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Build web visualizer
        run: pnpm build:web

      - name: Demo smoke test (simulated)
        run: |
          pnpm demo --json > demo-results.json
          node -e "
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('demo-results.json', 'utf8'));
          if (report.simulated !== true) throw new Error('demo must be marked simulated');
          if (!Array.isArray(report.runs) || report.runs.length !== 2) throw new Error('expected two runs');
          for (const run of report.runs) {
            if (run.summary.completedRequests !== run.summary.totalRequests) {
              throw new Error('demo run did not complete every request');
            }
          }
          console.log('demo smoke test passed (simulated)');
          "

      - name: Prefix cache smoke test (simulated)
        run: |
          pnpm demo --prefix-cache --json > prefix-results.json
          node -e "
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('prefix-results.json', 'utf8'));
          if (report.simulated !== true) throw new Error('demo must be marked simulated');
          for (const run of report.runs) {
            if (run.summary.completedRequests !== run.summary.totalRequests) {
              throw new Error('prefix demo run did not complete every request');
            }
            if (!run.summary.prefixCache || run.summary.prefixCache.hitTokens <= 0) {
              throw new Error('expected prefix hits in every run');
            }
          }
          console.log('prefix cache smoke test passed (simulated)');
          "

      - name: Benchmark smoke test (simulated)
        run: |
          pnpm bench --smoke --json > bench-smoke.json
          node -e "
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('bench-smoke.json', 'utf8'));
          if (report.simulated !== true) throw new Error('benchmark must be marked simulated');
          if (report.schemaVersion !== '1.0') throw new Error('unexpected benchmark schema');
          if (report.costModelVersion !== 'synthetic-v1') throw new Error('unexpected cost model version');
          if (report.runCount !== 2) throw new Error('smoke benchmark should run two cells');
          for (const scenario of report.scenarios) {
            for (const run of scenario.runs) {
              if (run.summary.completedRequests !== run.summary.totalRequests) {
                throw new Error('benchmark run did not complete every request');
              }
              if (run.summary.e2eMs.p99 === null) throw new Error('missing P99');
            }
          }
          console.log('benchmark smoke test passed (simulated)');
          "

      - name: Validate benchmark JSON Schema
        run: pnpm validate:bench bench-smoke.json
